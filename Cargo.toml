[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/velox-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

# Dependencies are added on main only. Hardware branches never add any, so Cargo.lock never
# conflicts when main is merged into them.
[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
velox-core = { path = "crates/velox-core" }
velox-cpu = { path = "crates/velox-cpu" }
velox-cuda = { path = "crates/velox-cuda" }
velox-build = { path = "crates/velox-build" }
velox-variant = { path = "crates/velox-variant" }
velox-conformance = { path = "crates/velox-conformance" }
velox-weights = { path = "crates/velox-weights" }
velox-serve = { path = "crates/velox-serve" }
velox-models = { path = "crates/velox-models" }
velox-frontend = { path = "crates/velox-frontend" }
velox-engine = { path = "crates/velox-engine" }

[profile.release]
debug = 1
